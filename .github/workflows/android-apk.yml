name: NOTICE BOARD Android APK

on:
  push:
    branches: [ "main", "fix/permanent-debug-signing" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NOTICE BOARD source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK command-line tools and platform tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36.1" "build-tools;36.1.0"

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.NOTICE_BOARD_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "::error::Missing NOTICE_BOARD_GOOGLE_SERVICES_JSON_BASE64 repository secret"; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          python3 -c 'import json; d=json.load(open("app/google-services.json")); assert d["project_info"]["project_id"] == "gen-lang-client-0143905151"; assert any(c["client_info"]["android_client_info"]["package_name"] == "com.aistudio.noticeboard.kxmpzq" for c in d["client"])'
          echo "Firebase configuration validated for UNIVERSAL_NOTICE_BOARD."

      - name: Restore permanent Android debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTICE_BOARD_DEBUG_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.NOTICE_BOARD_DEBUG_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.NOTICE_BOARD_DEBUG_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NOTICE_BOARD_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing NOTICE_BOARD_DEBUG_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing NOTICE_BOARD_DEBUG_KEY_ALIAS secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing NOTICE_BOARD_DEBUG_STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing NOTICE_BOARD_DEBUG_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -keystore debug.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Build debug APK with permanent signing key
        shell: bash
        env:
          NOTICE_BOARD_DEBUG_KEY_ALIAS: ${{ secrets.NOTICE_BOARD_DEBUG_KEY_ALIAS }}
          NOTICE_BOARD_DEBUG_STORE_PASSWORD: ${{ secrets.NOTICE_BOARD_DEBUG_STORE_PASSWORD }}
          NOTICE_BOARD_DEBUG_KEY_PASSWORD: ${{ secrets.NOTICE_BOARD_DEBUG_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean :app:assembleDebug 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOTICE-BOARD-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify APK and print signing certificate fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOTICE-BOARD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
